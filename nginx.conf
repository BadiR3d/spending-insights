server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets are immutable and can be cached indefinitely.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The service worker must revalidate on every load so demo updates propagate.
  location = /mockServiceWorker.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Serve index.html for application routes (single-page app fallback).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
